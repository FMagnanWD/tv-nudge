plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.tvnudge.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.tvnudge.tv'
        minSdk 24
        // 28 : la permission d'affichage par-dessus les autres apps se donne par adb (appops), Fire OS n'a pas d'écran pour ça.
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
}
